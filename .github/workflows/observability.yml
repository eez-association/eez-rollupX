name: Observability

on:
  pull_request:
    paths:
      - observability/**
      - crates/eez-observer/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/observability.yml
  push:
    branches: [main]
    paths:
      - observability/**
      - crates/eez-observer/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/observability.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: observability
      - name: Configuration and dashboard checks
        run: python3 observability/tests/test_prepare.py
      - name: Format
        run: cargo fmt -p eez-observer --check
      - name: Exporter tests
        run: cargo test --locked -p eez-observer
      - name: Exporter lint
        run: cargo clippy --locked -p eez-observer --all-targets -- -D warnings
      - name: Build exporter
        run: cargo build --locked -p eez-observer
      - name: Isolated backend, query, log and alert tests
        run: python3 -u observability/tests/smoke-stack.py --report artifacts/observability-stack-validation.json
      - name: Preserve sanitized validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: observability-validation
          path: artifacts/observability-stack-validation.json
          if-no-files-found: warn
