name: Docker output-cache compression benchmark

# Temporary validation branch only; not part of the merge candidate.
on:
  push:
    branches: [test/docker-native-integration]

permissions:
  contents: read

concurrency:
  group: rollupx-shipping-cache-benchmark
  cancel-in-progress: false

jobs:
  compare:
    runs-on: homelab-rust
    timeout-minutes: 30
    env:
      EEZ_CARGO_STATE_CACHE: 'true'
      EEZ_COMPILER_CACHE: none
      EEZ_RUNTIME_CACHE: 'false'
      EEZ_PUBLISH_IMAGES: 'false'
      RUST_IMAGE: rust@sha256:365468470075493dc4583f47387001854321c5a8583ea9604b297e67f01c5a4f
      RUNTIME_IMAGE: debian@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Prepare private client and production build contract
        id: plan
        shell: bash
        run: |
          mkdir -p artifacts/cache-compression
          lscpu | tee artifacts/cache-compression/cpu.txt
          git rev-parse HEAD
          git ls-tree HEAD eez-core-protocol
          export EEZ_RUNTIME_OUTPUT_DIR="$(mktemp -d "$RUNNER_TEMP/compression-runtime.XXXXXXXX")"
          export EEZ_NATIVE_TEST_OUTPUT_DIR="$(mktemp -d "$RUNNER_TEMP/compression-tests.XXXXXXXX")"
          export DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/compression-client.XXXXXXXX")"
          printf 'EEZ_RUNTIME_OUTPUT_DIR=%s\nEEZ_NATIVE_TEST_OUTPUT_DIR=%s\nDOCKER_CONFIG=%s\n' \
            "$EEZ_RUNTIME_OUTPUT_DIR" "$EEZ_NATIVE_TEST_OUTPUT_DIR" "$DOCKER_CONFIG" >> "$GITHUB_ENV"
          mkdir "$DOCKER_CONFIG/cli-plugins"
          curl --fail --silent --show-error --location --max-time 90 \
            https://github.com/docker/buildx/releases/download/v0.37.1/buildx-v0.37.1.linux-amd64 \
            -o "$DOCKER_CONFIG/cli-plugins/docker-buildx"
          printf '%s  %s\n' 9447199cdb435f25880548343c128a4b6650e8891ee598905d8d29d39a8e359b \
            "$DOCKER_CONFIG/cli-plugins/docker-buildx" | sha256sum --check --status
          chmod 755 "$DOCKER_CONFIG/cli-plugins/docker-buildx"
          bash scripts/ci/check-docker.sh
          bash scripts/ci/build-runtime-artifacts.sh prepare-state
      - name: Restore previously tested seed, never rebuild a missing seed
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-cargo-state/transport
          key: ${{ steps.plan.outputs.key }}
          fail-on-cache-miss: true
      - name: Build unchanged real outputs and all runtime images
        timeout-minutes: 12
        shell: bash
        run: |
          bash scripts/ci/build-runtime-artifacts.sh 2>&1 | tee artifacts/cache-compression/producer.log
          grep -q 'Docker Cargo state: hit' artifacts/cache-compression/producer.log
          ! grep -q 'Compiling ' artifacts/cache-compression/producer.log
      - uses: ./.github/actions/native-test-tools
      - run: bash scripts/ci/init-cargo-target.sh
      - name: Execute release units and protocol vectors
        run: python3 scripts/ci/native-tests.py run "$EEZ_NATIVE_TEST_OUTPUT_DIR" --suite unit
      - name: Compare identical output bytes on the same node with empty builders
        shell: bash
        run: |
          mapfile -t builds < <(find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d -name 'eez-runtime-build.*')
          test "${#builds[@]}" -eq 1
          outputs="${builds[0]}/binaries"
          test -f "$outputs/native-tests/native-tests.tar.zst"
          evidence="$GITHUB_WORKSPACE/artifacts/cache-compression"
          printf 'FROM scratch\nCOPY . /\n' > "$evidence/Dockerfile"
          builder=
          trap 'if [[ -n "$builder" ]]; then docker buildx rm "$builder"; fi' EXIT
          # Reverse the local sample order. Compilation is excluded; both
          # builders receive the exact same production files and resource limits.
          for compression in zstd gzip; do
            builder="eez-compress-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$compression"
            docker buildx create --name "$builder" --driver docker-container \
              --driver-opt image=moby/buildkit:v0.33.0,memory=20g,memory-swap=20g,cpu-period=100000,cpu-quota=400000
            args=(docker buildx build --builder "$builder" --platform linux/amd64 \
                  --progress plain --provenance=false -f "$evidence/Dockerfile")
            docker buildx inspect "$builder" --bootstrap
            docker exec "buildx_buildkit_${builder}0" sh -ec \
              'test "$(cat /sys/fs/cgroup/cpu.max)" = "400000 100000"; test "$(cat /sys/fs/cgroup/memory.max)" = 21474836480; test "$(cat /sys/fs/cgroup/memory.swap.max)" = 0'
            "${args[@]}" --output type=cacheonly "$outputs" > "$evidence/$compression-prepare.log" 2>&1
            cache="type=local,dest=$evidence/$compression-cache,mode=min"
            if [[ "$compression" == zstd ]]; then cache+=",compression=zstd,compression-level=1"; fi
            { time "${args[@]}" --output type=cacheonly --cache-to "$cache" "$outputs"; } \
              2>&1 | tee "$evidence/$compression-export.log"
            du -sb "$evidence/$compression-cache" | tee "$evidence/$compression-size.txt"
            digest=$(jq -r '.manifests[0].digest' "$evidence/$compression-cache/index.json")
            jq '[.layers[] | {mediaType,size}]' "$evidence/$compression-cache/blobs/sha256/${digest#sha256:}" \
              | tee "$evidence/$compression-layers.json"
            jq -e --arg type "application/vnd.oci.image.layer.v1.tar+$compression" \
              'length == 1 and all(.[]; .mediaType == $type)' "$evidence/$compression-layers.json"
            docker buildx rm "$builder"
            builder="eez-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$compression"
            docker buildx create --name "$builder" --driver docker-container \
              --driver-opt image=moby/buildkit:v0.33.0,memory=20g,memory-swap=20g,cpu-period=100000,cpu-quota=400000
            docker buildx inspect "$builder" --bootstrap
            { time docker buildx build --builder "$builder" --platform linux/amd64 --progress plain \
              --provenance=false -f "$evidence/Dockerfile" --cache-from "type=local,src=$evidence/$compression-cache" \
              --output "type=local,dest=$RUNNER_TEMP/$builder" "$outputs"; } \
              2>&1 | tee "$evidence/$compression-restore.log"
            diff -qr "$outputs" "$RUNNER_TEMP/$builder"
            grep -q CACHED "$evidence/$compression-restore.log"
            docker buildx rm "$builder"
            builder=
          done
      - name: Preserve measurements, not the large payloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cache-compression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/cache-compression/*.log
            artifacts/cache-compression/*.txt
            artifacts/cache-compression/*.json
            artifacts/cache-compression/Dockerfile
          retention-days: 7
