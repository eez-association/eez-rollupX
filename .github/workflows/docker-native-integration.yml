name: Docker-native cold seed validation

# Temporary test branch only. This workflow is excluded from the merge candidate.
on:
  push:
    branches: [test/docker-native-integration]

permissions:
  contents: read

concurrency:
  group: rollupx-shipping-cache-benchmark
  cancel-in-progress: false

jobs:
  cold:
    if: github.ref == 'refs/heads/test/docker-native-integration'
    runs-on: homelab-rust
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      EEZ_CARGO_STATE_CACHE: 'true'
      EEZ_COMPILER_CACHE: none
      EEZ_RUNTIME_CACHE: 'false'
      EEZ_PUBLISH_IMAGES: 'false'
      EEZ_EXPECT_PUBLISHED: 'false'
      # Test-only cache scope. Production continues to restrict writes to main.
      EEZ_DEFAULT_BRANCH: test/docker-native-integration
      RUST_IMAGE: rust@sha256:365468470075493dc4583f47387001854321c5a8583ea9604b297e67f01c5a4f
      RUNTIME_IMAGE: debian@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - run: bash scripts/ci/check-docker.sh
      - name: Initialize isolated outputs and record hardware
        run: |
          mkdir -p artifacts/docker-native-integration
          lscpu | tee artifacts/docker-native-integration/cpu.txt
          git rev-parse HEAD
          git ls-tree HEAD eez-core-protocol
          echo "EEZ_RUNTIME_OUTPUT_DIR=$(mktemp -d "$RUNNER_TEMP/docker-state-runtime.XXXXXXXX")" >> "$GITHUB_ENV"
          echo "EEZ_NATIVE_TEST_OUTPUT_DIR=$(mktemp -d "$RUNNER_TEMP/docker-state-tests.XXXXXXXX")" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/docker-state-client.XXXXXXXX")" >> "$GITHUB_ENV"
      - name: Prepare exact production contract
        id: plan
        timeout-minutes: 10
        run: |
          mkdir -p "$DOCKER_CONFIG/cli-plugins"
          curl --fail --silent --show-error --location --max-time 90 \
            https://github.com/docker/buildx/releases/download/v0.37.1/buildx-v0.37.1.linux-amd64 \
            -o "$DOCKER_CONFIG/cli-plugins/docker-buildx"
          printf '%s  %s\n' 9447199cdb435f25880548343c128a4b6650e8891ee598905d8d29d39a8e359b \
            "$DOCKER_CONFIG/cli-plugins/docker-buildx" | sha256sum --check --status
          chmod 755 "$DOCKER_CONFIG/cli-plugins/docker-buildx"
          time bash scripts/ci/build-runtime-artifacts.sh prepare-state
      - name: Cold real producer and all runtime image packaging
        run: |
          time bash scripts/ci/build-runtime-artifacts.sh 2>&1 | tee artifacts/docker-native-integration/cold.log
          grep -q 'Docker Cargo state: miss' artifacts/docker-native-integration/cold.log
      - name: Verify exact produced runtime
        run: bash scripts/ci/prepare-runtime-artifacts.sh "$EEZ_RUNTIME_OUTPUT_DIR"
      - uses: ./.github/actions/native-test-tools
      - run: bash scripts/ci/init-cargo-target.sh
      - name: Execute all release units and protocol vectors
        run: python3 scripts/ci/native-tests.py run "$EEZ_NATIVE_TEST_OUTPUT_DIR" --suite unit
      - name: Export only tested state
        id: export
        timeout-minutes: 10
        run: |
          time bash scripts/ci/build-runtime-artifacts.sh export-state
          du -sb .ci-cargo-state/transport
      - name: Save only this validation branch's seed
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        timeout-minutes: 10
        with:
          path: .ci-cargo-state/transport
          key: ${{ steps.plan.outputs.key }}
      - name: Preserve diagnostics and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: docker-native-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/docker-native-integration
            .ci-cargo-state/contract/toolchain.txt
            .ci-cargo-state/plan.json
          retention-days: 7
