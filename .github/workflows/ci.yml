name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Share a group only within a PR. Unique run IDs keep main/manual runs independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Clippy and debug unit tests do not need debug symbols. E2E and protocol
  # vector tests execute the release producer's verified artifacts.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  build-runtime:
    name: Build runtime artifacts
    uses: ./.github/workflows/build-runtime.yml
    permissions:
      contents: read
      packages: write

  kurtosis-e2e:
    name: Kurtosis E2E
    needs: build-runtime
    if: ${{ needs.build-runtime.outputs.published == 'true' }}
    uses: ./.github/workflows/kurtosis-e2e.yml
    permissions:
      contents: read
      packages: read
    with:
      runtime-ref: ${{ needs.build-runtime.outputs.runtime-ref }}

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    # Allow a cold dependency build on the standard hosted runner.
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Install pinned secret scanner
        run: |
          scanner_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXXXX")"
          curl --fail --silent --show-error --location --max-time 90 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$scanner_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          echo "$scanner_dir" >> "$GITHUB_PATH"
      - name: Scan fetched Git history including merge diffs
        run: |
          gitleaks git . --config .gitleaks.toml --log-opts='--all -m' \
            --redact=100 --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null
      - name: Prepare hosted runner disk
        run: bash scripts/ci/prepare-hosted-runner.sh
      - name: Initialize Cargo target directory
        run: bash scripts/ci/init-cargo-target.sh
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - name: Rust source cache
        if: ${{ runner.environment == 'github-hosted' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: "false"
          cache-on-failure: "false"
          cache-bin: "false"
          add-rust-environment-hash-key: "false"
          shared-key: registry
          key: ${{ hashFiles('**/Cargo.lock') }}
      - uses: ./.github/actions/compiler-cache
        with:
          enabled: ${{ vars.CI_COMPILER_CACHE != 'false' }}
      - name: Install system dependencies
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y jq libclang-dev pkg-config libssl-dev cmake protobuf-compiler
      - name: Install LLVM 22 for upstream Reth
        run: |
          sudo bash scripts/ci/install-llvm.sh
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
      - name: Format
        run: cargo fmt --all --check
      - name: Install dependency audit tools
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: cargo-deny,cargo-audit
      - name: Check dependency policy
        run: cargo deny check advisories bans sources
      - name: Check known vulnerabilities
        run: cargo audit
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Install pinned Docker Compose for configuration checks
        run: |
          # Hosted Compose 2.38.2 still reads env_file with --no-env-resolution.
          # Keep static checks independent of operator deployment bindings.
          compose_config="$(mktemp -d "$RUNNER_TEMP/eez-compose.XXXXXXXX")"
          mkdir -p "$compose_config/cli-plugins"
          curl --fail --silent --show-error --location --max-time 90 \
            https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64 \
            -o "$compose_config/cli-plugins/docker-compose"
          printf '%s  %s\n' db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576 \
            "$compose_config/cli-plugins/docker-compose" | sha256sum --check --status
          chmod 755 "$compose_config/cli-plugins/docker-compose"
          test "$(DOCKER_CONFIG="$compose_config" docker compose version --short)" = 5.5.1
          echo "DOCKER_CONFIG=$compose_config" >> "$GITHUB_ENV"
      - name: Test CI scripts
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - name: Validate settlement policy configuration propagation
        run: python3 scripts/check-settlement-policy-config.py
      - name: Clippy
        run: bash scripts/ci/with-compiler-cache.sh clippy cargo clippy --locked --timings --workspace --all-targets -- -D warnings
      - name: Cargo failure diagnostics
        if: failure()
        run: bash scripts/ci/cargo-failure-diagnostics.sh
      - name: Upload build measurements
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-build-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/build-metrics
            ${{ env.CARGO_TARGET_DIR }}/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 3

  debug-unit-tests:
    name: Debug Unit Tests
    # Workspace lib/bin unit tests in the ordinary test profile, in parallel with
    # the producer. Their dev-dependencies enable test-only features (Tokio's
    # test-util), so they stay out of the release archive, whose dependency
    # feature set must equal the shipping build's.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Prepare hosted runner disk
        run: bash scripts/ci/prepare-hosted-runner.sh
      - name: Initialize Cargo target directory
        run: bash scripts/ci/init-cargo-target.sh
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
        with:
          toolchain: "1.95.0"
      - name: Rust source cache
        if: ${{ runner.environment == 'github-hosted' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: "false"
          cache-on-failure: "false"
          cache-bin: "false"
          add-rust-environment-hash-key: "false"
          shared-key: registry
          key: ${{ hashFiles('**/Cargo.lock') }}
      - uses: ./.github/actions/compiler-cache
        with:
          enabled: ${{ vars.CI_COMPILER_CACHE != 'false' }}
      - name: Install system dependencies
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y jq libclang-dev pkg-config libssl-dev cmake protobuf-compiler
      - name: Install LLVM 22 for upstream Reth
        run: |
          sudo bash scripts/ci/install-llvm.sh
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/native-test-tools
      - name: Workspace unit tests (debug)
        env:
          # Any test that would launch a node or signer must fail, not compile one.
          EEZ_TEST_PREBUILT: "1"
        run: >-
          bash scripts/ci/with-compiler-cache.sh debug-units
          cargo nextest run --locked --timings --workspace --lib --bins
          --profile ci --no-fail-fast --no-tests=fail
      - name: Cargo failure diagnostics
        if: failure()
        run: bash scripts/ci/cargo-failure-diagnostics.sh
      - name: Upload build measurements
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-unit-build-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/build-metrics
            ${{ env.CARGO_TARGET_DIR }}/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 3

  embedded-e2e:
    name: Embedded E2E Tests (${{ matrix.partition }})
    needs: build-runtime
    if: ${{ needs.build-runtime.outputs.published == 'true' }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    # Execution only: the producer owns all Rust compilation.
    timeout-minutes: 90
    # Separate runners isolate each shard's processes; tests remain serial inside
    # each shard. Keep every shard running so one failure cannot hide coverage.
    strategy:
      fail-fast: false
      matrix:
        partition: [slice:1/4, slice:2/4, slice:3/4, slice:4/4]
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Initialize pinned submodules
        timeout-minutes: 6
        run: bash scripts/ci/init-submodules.sh
      - uses: ./.github/actions/native-test-artifact
        with:
          payload-ref: ${{ needs.build-runtime.outputs.tests-ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Install system dependencies
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Integration tests (e2e, serial within shard)
        env:
          NEXTEST_PARTITION: ${{ matrix.partition }}
        run: bash scripts/ci/run-native-suite.sh embedded "$EEZ_NATIVE_TEST_DIR" "$NEXTEST_PARTITION"
      - name: Cargo failure diagnostics
        if: failure()
        run: bash scripts/ci/cargo-failure-diagnostics.sh
      - name: Upload embedded e2e diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: embedded-e2e-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/embedded-e2e
          if-no-files-found: warn
          retention-days: 3

  cross-chain-e2e:
    name: Cross-Chain E2E Tests (${{ matrix.partition }})
    needs: build-runtime
    if: ${{ needs.build-runtime.outputs.published == 'true' }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    # Execution only: the producer owns all Rust compilation.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        partition: [slice:1/4, slice:2/4, slice:3/4, slice:4/4]
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Initialize pinned submodules
        timeout-minutes: 6
        run: bash scripts/ci/init-submodules.sh
      - uses: ./.github/actions/native-test-artifact
        with:
          payload-ref: ${{ needs.build-runtime.outputs.tests-ref }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Integration tests (cross-chain, serial within shard)
        env:
          NEXTEST_PARTITION: ${{ matrix.partition }}
        run: bash scripts/ci/run-native-suite.sh cross-chain "$EEZ_NATIVE_TEST_DIR" "$NEXTEST_PARTITION"
      - name: Cargo failure diagnostics
        if: failure()
        run: bash scripts/ci/cargo-failure-diagnostics.sh
      - name: Upload cross-chain e2e diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-chain-e2e-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cross-chain-e2e
          if-no-files-found: warn
          retention-days: 3

  ci-result:
    name: CI Result
    if: always()
    needs: [build-runtime, lint, debug-unit-tests, embedded-e2e, cross-chain-e2e, kurtosis-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    # Serialize main's tag updates; PR gates have their own ref and never publish.
    concurrency:
      group: runtime-image-tags-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Require every validation lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          published = jobs['build-runtime']['outputs'].get('published')
          if published not in ('true', 'false'):
              raise SystemExit('producer did not report its execution mode')
          remote = {'embedded-e2e', 'cross-chain-e2e', 'kurtosis-e2e'}
          for name, job in jobs.items():
              expected = 'skipped' if name in remote and published == 'false' else 'success'
              if job['result'] != expected:
                  raise SystemExit(f"{name}: {job['result']} (expected {expected})")
          print('All required validation passed for the release candidate.')
          PY
      - name: Publish commit and latest image tags
        if: ${{ success() && github.ref == 'refs/heads/main' && needs.build-runtime.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGES: ${{ needs.build-runtime.outputs.images }}
        shell: bash
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          references="$(jq -er '[.node.reference, .signer.reference, .deploy.reference] |
            if all(.[]; type == "string" and test("@sha256:[0-9a-f]{64}$"))
            then .[] else error("Expected three runtime image digests") end' <<<"$IMAGES")"
          [[ -n "$references" ]]
          while IFS= read -r reference; do
            repository="${reference%@*}"
            docker buildx imagetools create --prefer-index=false \
              --tag "$repository:$GITHUB_SHA" "$reference"
          done <<<"$references"

          # An older, slower run may finish after a newer commit. Its commit tag
          # is valid, but it must not replace latest for the current main head.
          main_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$main_head" != "$GITHUB_SHA" ]]; then
            echo 'Commit tags published; latest unchanged because main has advanced.'
            exit 0
          fi
          while IFS= read -r reference; do
            repository="${reference%@*}"
            docker buildx imagetools create --prefer-index=false \
              --tag "$repository:latest" "$reference"
            printf -- '- `%s:%s` and `%s:latest` → `%s`\n' \
              "$repository" "$GITHUB_SHA" "$repository" "$reference" >> "$GITHUB_STEP_SUMMARY"
          done <<<"$references"
