name: Cargo cache transport probe

# Experimental: no automatic PR/main runs, image publication or production caches.
on:
  # Temporary execution branch only; never open a PR from this branch.
  push:
    branches: [test/cargo-cache-probe-run]
  workflow_dispatch:
    inputs:
      runner:
        description: Run both jobs on this pool (repeat on the other pool separately)
        type: choice
        default: ubuntu-24.04
        options: [ubuntu-24.04, homelab-rust]

permissions:
  contents: read

concurrency:
  group: cargo-cache-probe-${{ inputs.runner || 'ubuntu-24.04' }}
  cancel-in-progress: false

env:
  PROBE_IMAGE: rust@sha256:365468470075493dc4583f47387001854321c5a8583ea9604b297e67f01c5a4f
  # Identical relative path and exact key in both jobs; no broad restore prefixes.
  PROBE_CACHE_KEY: cargo-transport-probe-v2-${{ inputs.runner || 'ubuntu-24.04' }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  seed:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: bash scripts/ci/check-docker.sh
      - name: Pull pinned build environment
        run: docker pull "$PROBE_IMAGE"
      - name: Compile tiny fixture with an empty Cargo target
        run: python3 scripts/ci/cargo-cache-probe.py seed "$GITHUB_WORKSPACE/artifacts/cargo-cache-probe"
      - name: Save fixture sources and compilation state only
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/cargo-cache-probe/state
          key: ${{ env.PROBE_CACHE_KEY }}
      - name: Preserve failed probe evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-cache-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/cargo-cache-probe/*.json
            artifacts/cargo-cache-probe/*.log
          retention-days: 3

  restore:
    needs: seed
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: bash scripts/ci/check-docker.sh
      - name: Require an empty job-local probe directory
        run: test ! -e "$GITHUB_WORKSPACE/artifacts/cargo-cache-probe"
      - name: Restore exact seed state on the fresh runner
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/cargo-cache-probe/state
          key: ${{ env.PROBE_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Pull identical build environment
        run: docker pull "$PROBE_IMAGE"
      - name: Prepare independent source-sync comparison
        run: |
          command -v rsync
          mkdir "$GITHUB_WORKSPACE/artifacts/cargo-freshness-probe"
          cp -a "$GITHUB_WORKSPACE/artifacts/cargo-cache-probe/state" \
            "$GITHUB_WORKSPACE/artifacts/cargo-freshness-probe/state"
      - name: Verify restoration, report reuse, and reject stale code and tests
        run: python3 scripts/ci/cargo-cache-probe.py restore "$GITHUB_WORKSPACE/artifacts/cargo-cache-probe"
      - name: Verify checksum-synchronized reuse and mutation cases
        run: python3 scripts/ci/cargo-cache-probe.py freshness "$GITHUB_WORKSPACE/artifacts/cargo-freshness-probe"
      - name: Preserve failed probe evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-cache-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/cargo-cache-probe/*.json
            artifacts/cargo-cache-probe/*.log
            artifacts/cargo-freshness-probe/*.json
            artifacts/cargo-freshness-probe/*/*.json
            artifacts/cargo-freshness-probe/*/*.log
          retention-days: 3
