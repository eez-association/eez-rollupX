name: Kurtosis E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kurtosis-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kurtosis-e2e:
    name: Kurtosis E2E
    runs-on: homelab-rust
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: "0"
      KURTOSIS_ENCLAVE: eez-ci
      EEZ_NODE_IMAGE: eez-node:ci-${{ github.sha }}
      EEZ_PROOF_SIGNER_IMAGE: eez-proof-signer:ci-${{ github.sha }}
      EEZ_DEPLOY_IMAGE: eez-deploy:ci-${{ github.sha }}
      EEZ_CI_RESULT_DIR: ${{ github.workspace }}/artifacts/kurtosis-e2e
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Initialize submodules
        run: git submodule update --init --recursive
      - name: Initialize Cargo target directory
        run: bash scripts/ci/init-cargo-target.sh
      - name: Reclaim runner filesystem space
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Install Kurtosis
        run: |
          echo "deb [trusted=yes] https://sdk.kurtosis.com/kurtosis-cli-release-artifacts/ /" | sudo tee /etc/apt/sources.list.d/kurtosis.list
          sudo apt-get update
          sudo apt-get install -y bc kurtosis-cli jq openssl
          kurtosis engine start
      - name: Run Enclave
        run: bash testing/kurtosis/run-ci.sh
      - name: Cargo failure diagnostics
        if: failure()
        run: bash scripts/ci/cargo-failure-diagnostics.sh
      - name: Stop kurtosis enclave
        if: always()
        run: bash testing/kurtosis/stop.sh
      - name: Upload kurtosis e2e diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kurtosis-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/kurtosis-e2e
          if-no-files-found: warn
          retention-days: 7
      - name: Remove candidate images
        if: always()
        run: docker image rm "$EEZ_NODE_IMAGE" "$EEZ_PROOF_SIGNER_IMAGE" "$EEZ_DEPLOY_IMAGE" || true
