[package]
name = "zeth-mpt"
workspace = "../../../.."
edition = "2021"
version.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
disallowed_types = "deny"

[lints.rustdoc]
all = "warn"

[dependencies]
alloy-trie = { version = "0.9.4", default-features = false, features = ["ethereum"] }
alloy-rlp = { version = "0.3.13", default-features = false }
alloy-primitives = { version = "1.6.0", default-features = false, features = ["map-foldhash", "map-indexmap"] }

arrayvec = { version = "0.7", default-features = false }
bincode = { version = "1.3", optional = true }
rkyv = { version = "0.8", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], optional = true }
itertools = { version = "0.14", default-features = false, features = ["use_alloc"], optional = true }
thiserror = { version = "2.0", default-features = false, optional = true }

[dev-dependencies]
serde_json = { version = "1.0" }

[features]
default = []
rkyv = ["dep:rkyv", "dep:itertools"]
serde = [
    "dep:serde",
    "dep:bincode",
    "alloy-primitives/serde",
    "alloy-trie/serde",
]
rlp_serialize = ["dep:itertools"]
orphan = ["dep:thiserror"]
