[package]
name = "stateless"
workspace = "../../../.."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
homepage = "https://github.com/paradigmxyz/stateless"
repository = "https://github.com/paradigmxyz/stateless"
description = "Stateless Ethereum block validation using execution witnesses"

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
disallowed_types = "deny"

[lints.rustdoc]
all = "warn"

[dependencies]
# internal
tries = { path = "../tries" }

# alloy
alloy-primitives = { version = "1.6.0", default-features = false, features = ["map-foldhash", "map-indexmap"] }
alloy-rlp = { version = "0.3.13", default-features = false }
alloy-consensus = { version = "=2.5.0", default-features = false }
alloy-eips = { version = "=2.5.0", default-features = false }
alloy-rpc-types-debug = { version = "=2.5.0", default-features = false }
alloy-genesis = { version = "=2.5.0", default-features = false, features = ["serde-bincode-compat"] }

# reth
reth-ethereum-consensus = { git = "https://github.com/paradigmxyz/reth", rev = "444e867155c2a7a4c028e479ca7201b0b6871579", default-features = false }
reth-primitives-traits = { version = "0.8.1", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "444e867155c2a7a4c028e479ca7201b0b6871579", default-features = false, features = ["serde"] }
reth-evm = { git = "https://github.com/paradigmxyz/reth", rev = "444e867155c2a7a4c028e479ca7201b0b6871579", default-features = false }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", rev = "444e867155c2a7a4c028e479ca7201b0b6871579", default-features = false }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", rev = "444e867155c2a7a4c028e479ca7201b0b6871579", default-features = false }
reth-consensus = { git = "https://github.com/paradigmxyz/reth", rev = "444e867155c2a7a4c028e479ca7201b0b6871579", default-features = false }

# revm
revm = { version = "43.0.3", default-features = false }
revm-bytecode = { version = "43.0.0", default-features = false }
revm-database-interface = { version = "43.0.0", default-features = false }
revm-state = { version = "43.0.0", default-features = false }

# misc
thiserror = { version = "2.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_with = { version = "3.16", default-features = false, features = ["alloc"] }

[dev-dependencies]
zeth-mpt = { path = "../zeth-mpt" }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", rev = "444e867155c2a7a4c028e479ca7201b0b6871579" }
serde_json = { version = "1.0" }
