# Packaged chiado stack: eez-node (embedded chiado L1 + L2 + composer),
# eez-proof-signer, and lighthouse (drives the embedded L1). Single-L1
# topology — no standalone
# tip-follower reth: the bundle target-block oracle falls back to the
# embedded L1 (EEZ_L1_TARGET_RPC_URL unset), which tracks the canonical
# tip in steady state. The one-time protocol deploy is done against an
# external chiado RPC before `up` (see README / scripts/devnet-test.sh).
#
# Prereqs (one-time, see README):
#   1. Download an L1 snapshot into ${L1_SNAPSHOT_DIR}:
#        docker run --rm -v ${L1_SNAPSHOT_DIR}:/data \
#          ghcr.io/gnosischain/reth_gnosis:v2.0.0 \
#          download --chain chiado --minimal --datadir /data
#   2. Create the shared JWT: openssl rand -hex 32 > ${JWT_FILE}
#   3. Deploy the protocol on chiado and write deployments.env
#        (make deploy-protocol against EEZ_L1_RPC_URL=<external chiado RPC>)
#   4. Fill .env.chiado (keys + bundler) from .env.chiado.example
#
# Then: docker compose -f docker-compose.chiado-node.yml up
#
# All services use host networking so lighthouse↔eez-node engine API and
# the embedded L1 / lighthouse libp2p peering work without port mapping.

services:
  eez-proof-signer:
    build:
      context: .
      dockerfile: Dockerfile.signer
    image: eez-proof-signer:local
    container_name: eez-proof-signer-chiado
    network_mode: host
    restart: unless-stopped
    # The default request deadline is 10 minutes; allow an admitted request
    # to drain when Compose stops the service.
    stop_grace_period: 11m
    env_file:
      - ./deployments.env
    environment:
      EEZ_PROOF_SIGNER_ADDR: 127.0.0.1:${EEZ_SIGNER_PORT:-50061}
      EEZ_CHAIN_CONFIG: /app/genesis.json
      EEZ_L1_CHAIN_CONFIG: chiado
      EEZ_PROOF_SIGNER_KEY: "${EEZ_PROOF_SIGNER_KEY:?set EEZ_PROOF_SIGNER_KEY}"
      EEZ_L2_SYSTEM_KEY: "${EEZ_L2_SYSTEM_KEY:?set EEZ_L2_SYSTEM_KEY}"
      RUST_LOG: "${EEZ_PROOF_SIGNER_RUST_LOG:-info}"
    volumes:
      - ${FRESH_GENESIS:?set FRESH_GENESIS}:/app/genesis.json:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "${EEZ_SIGNER_PORT:-50061}"]
      interval: 5s
      timeout: 2s
      retries: 12
    logging:
      driver: "local"

  eez-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: eez-node:local
    container_name: eez-node-chiado
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      eez-proof-signer:
        condition: service_healthy
    # Public deployment bindings come from the generated file. Private node
    # inputs are mapped explicitly below so the attestation key is never
    # injected into this container.
    env_file:
      - ./deployments.env
    environment:
      EEZ_L1_POSTER_KEY: "${EEZ_L1_POSTER_KEY:?set EEZ_L1_POSTER_KEY}"
      EEZ_L1_BUILDER_RPC_URL: "${EEZ_L1_BUILDER_RPC_URL:?set EEZ_L1_BUILDER_RPC_URL}"
      EEZ_L2_SYSTEM_KEY: "${EEZ_L2_SYSTEM_KEY:?set EEZ_L2_SYSTEM_KEY}"
      EEZ_PROVER_URL: http://127.0.0.1:${EEZ_SIGNER_PORT:-50061}
      EEZ_WITNESS_DB_PATH: /l2/witnesses
      # Embedded chiado L1 (reth_gnosis) — single L1 for the whole node.
      EEZ_L1_CHAIN: chiado
      EEZ_L1_CHAIN_ID: "10200"
      EEZ_L1_HTTP_PORT: "18645"
      # Embedded-L1 engine-API port. Override (L1_AUTH_PORT) if the host
      # already runs a reth on 18551 (e.g. a standalone chiado-reth).
      EEZ_L1_AUTH_PORT: "${L1_AUTH_PORT:-18551}"
      EEZ_L1_P2P_PORT: "30544"
      EEZ_L1_DATADIR: /l1
      EEZ_L1_JWT_SECRET: /jwt/jwt.hex
      EEZ_L1_RPC_URL: http://127.0.0.1:18645
      # Chiado is post-Fulu: blob posting uses the EIP-7594 pooled wrapper and
      # derivation reads full blobs reconstructed by the colocated
      # semi-supernode Lighthouse.
      EEZ_L1_BEACON_URL: "${EEZ_L1_BEACON_URL:?set the mandatory native blob Beacon API}"
      EEZ_L1_BLOB_SIDECAR_ENCODING: "${EEZ_L1_BLOB_SIDECAR_ENCODING:?set the mandatory native blob sidecar encoding}"
      # Forwarded but empty by default - the bundle
      # target-block oracle falls back to the embedded L1. Set it in
      # .env.chiado
      EEZ_L1_TARGET_RPC_URL: "${EEZ_L1_TARGET_RPC_URL:-}"
      # Keep explicit peers available when the embedded L1 backfills on restart.
      EEZ_L1_TRUSTED_PEERS: "${EEZ_L1_TRUSTED_PEERS:-}"
      EEZ_L1_ROLLUP_ID: "0"
      # Cross-chain wiring.
      EEZL2_ADDRESS: "0x4200000000000000000000000000000000000007"
      EEZ_CROSS_CHAIN_SOURCE_CHAIN_IDS: "10200"
      # L2 RPC — outbound front upstream + composer L2 reads.
      EEZ_L2_RPC_URL: http://127.0.0.1:18688
      # Transparent cross-chain ingress fronts (both required in composer mode).
      # Send L1→L2 (Inbound) txs to :18999, L2→L1 (Outbound) txs to :18998; every
      # other eth_* is transparently forwarded to the matching source-chain RPC.
      EEZ_L1_XCHAIN_PORT: "18999"
      EEZ_L2_XCHAIN_PORT: "18998"
      # Combined cap for both cross-chain directions; overflow remains queued.
      # Lower than the in-code default (50) because the whole bundle
      # [postBatch, user_tx...] has to fit a 17M Chiado block, not the 60M a
      # devnet L1 gives: 9M cap + 12 * 400k = 13.8M.
      EEZ_MAX_USER_TXS_PER_BUNDLE: "${EEZ_MAX_USER_TXS_PER_BUNDLE:-12}"
      # Emission + reorg bounds documented in .env.example. eez-node reads these
      # from the process env, and this service takes no env_file beyond
      # deployments.env, so they have to be forwarded explicitly. Defaults track
      # the in-code ones (composer.rs, timing.rs, l1_watcher.rs).
      # Omitted values stay absent. Legacy mode supplies its old defaults;
      # enabled policy rejects the old block cap and resolves active gas rules.
      EEZ_MAX_BLOCKS_PER_BATCH:
      EEZ_MAX_POSTBATCH_GAS:
      EEZ_SETTLEMENT_POLICY_ENABLED: "${EEZ_SETTLEMENT_POLICY_ENABLED:-false}"
      EEZ_SETTLEMENT_PURE_L2_MODE:
      EEZ_SETTLEMENT_PURE_L2_INTERVAL_MS:
      EEZ_SETTLEMENT_MAX_UNSETTLED_L2_BLOCKS:
      EEZ_SETTLEMENT_BLOB_FULLNESS_BPS:
      EEZ_MAX_BLOBS_PER_BATCH:
      EEZ_L1_POSTBATCH_PRIORITY_FEE:
      EEZ_L1_POSTBATCH_MIN_PRIORITY_FEE:
      EEZ_L1_POSTBATCH_MAX_PRIORITY_FEE:
      EEZ_L1_POSTBATCH_PRIORITY_MARGIN_BPS:
      EEZ_L1_POSTBATCH_MAX_FEE_PER_GAS:
      EEZ_L1_POSTBATCH_MAX_FEE_PER_BLOB_GAS:
      EEZ_L1_POSTBATCH_EXECUTION_HEADROOM_BPS:
      EEZ_L1_POSTBATCH_BLOB_HEADROOM_BPS:
      EEZ_L1_POSTBATCH_GAS_MARGIN_BPS:
      EEZ_L1_REORG_MAX_DEPTH_BLOCKS: "${EEZ_L1_REORG_MAX_DEPTH_BLOCKS:-62}"
      # Deterministic L1-anchored timings (must match any follower).
      EEZ_L1_BLOCK_TIME_MS: "5000"
      EEZ_L2_BLOCK_TIME_MS: "1000"
      # Reserve time for remote stateless validation and relay submission while
      # leaving ~800ms before the proof cutoff to prepare a full 12-tx bundle.
      # For other values, preserve measured preparation headroom before the next
      # whole L2-second boundary; an exact boundary leaves no headroom at all.
      EEZ_PROOF_TIME_MS: "${EEZ_PROOF_TIME_MS:-1500}"
      EEZ_SUBMISSION_SLACK_MS: "${EEZ_SUBMISSION_SLACK_MS:-700}"
      EEZ_BUNDLE_SUBMISSION_LEAD_MS: "${EEZ_BUNDLE_SUBMISSION_LEAD_MS:-7500}"
      # Don't freeze the sequencer when chiado bundles are slow to land.
      EEZ_MAX_SPECULATIVE_DEPTH: "${EEZ_MAX_SPECULATIVE_DEPTH:-0}"
      # Multi-composer: tolerate + adopt batches posted by the competing
      # composer instead of erroring "someone else is sequencing".
      EEZ_COMPOSER_EXPECT_EXTERNAL_BATCHES: "true"
      # L2.
      EEZ_L2_DATADIR: /l2
      EEZ_L2_GENESIS_PATH: /app/genesis.json
      # EEZ_INITIAL_BLOCK_HASH comes from deployments.env (deploy.sh writes it)
      # — the mounted genesis must produce that exact timestamp-sensitive hash.
    volumes:
      - ${L1_SNAPSHOT_DIR:?set L1_SNAPSHOT_DIR (reth download target)}:/l1
      - ${L2_DATA_DIR:?set L2_DATA_DIR}:/l2
      - ${JWT_FILE:?set JWT_FILE}:/jwt/jwt.hex:ro
      # Fresh-timestamp L2 genesis overriding the (stale) baked one, so the
      # L1-anchored scheduler starts near grid-height 0 instead of racing
      # millions of blocks. The block hash is timestamp-dependent and must
      # match the genesis rendered and registered by deploy.sh.
      - ${FRESH_GENESIS:?set FRESH_GENESIS}:/app/genesis.json:ro
    command:
      - node
      - --chain=/app/genesis.json
      - --datadir=/l2
      - --http
      - --http.addr=0.0.0.0
      - --http.port=18688
      - --http.api=eth,net,web3
      - --ws
      - --ws.addr=127.0.0.1
      - --ws.port=${EEZ_L2_WS_PORT:-18689}
      - --ws.api=eth,net,web3
      - --authrpc.addr=127.0.0.1
      - --authrpc.port=18684
      - --port=30640
      - --discovery.port=30640
      - --discovery.v5.port=30641
      - --ipcdisable
      - --disable-discovery
      - --engine.persistence-threshold=256
      - --engine.memory-block-buffer-target=128
    logging:
      driver: "local"

  lighthouse:
    image: sigp/lighthouse:v8.1.3
    container_name: eez-chiado-lighthouse
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      - eez-node
    volumes:
      - ${LIGHTHOUSE_DATA:?set LIGHTHOUSE_DATA}:/data
      - ${JWT_FILE:?set JWT_FILE}:/jwt/jwt.hex:ro
      - ${CHIADO_CONFIG_DIR:?set CHIADO_CONFIG_DIR}:/config-dir:ro
    command:
      - lighthouse
      - beacon_node
      - --testnet-dir=/config-dir
      - --listen-address=0.0.0.0
      - --port=9205
      - --quic-port=9206
      - --http
      - --http-address=127.0.0.1
      - --http-port=6152
      - --execution-endpoints=http://127.0.0.1:${L1_AUTH_PORT:-18551}
      - --jwt-secrets=/jwt/jwt.hex
      - --datadir=/data
      - --checkpoint-sync-url=${LH_CHECKPOINT_URL:-https://checkpoint.chiadochain.net/}
      # Fulu/PeerDAS full-blob retrieval is not available from an ordinary
      # sampling node. A semi-supernode custodies half the data columns and
      # reconstructs full blobs for /eth/v1/beacon/blobs/{block_id}, reducing
      # resource use compared with custodying every column as a supernode.
      - --semi-supernode
      # Direct Chiado peers supplement sparse discovery. Dial their endpoints
      # without pinning peer IDs, which can rotate when an operator rebuilds a
      # node. Lighthouse still validates peers against the configured network.
      - --libp2p-addresses=/ip4/57.131.40.177/tcp/9000,/ip4/45.79.214.176/tcp/9000,/ip4/51.210.221.124/tcp/9500,/ip4/57.129.122.18/tcp/9000,/ip4/51.210.221.124/tcp/9100,/ip4/137.74.112.3/tcp/9000,/ip4/65.109.101.48/tcp/9000
    logging:
      driver: "local"
