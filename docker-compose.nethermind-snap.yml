services:
  nethermind-follower:
    restart: ${NETHERMIND_SNAP_RESTART_POLICY:-no}
    environment:
      NETHERMIND_EEZCONFIG_SNAPBOOTSTRAPENABLED: 'true'
      NETHERMIND_INITCONFIG_PROCESSINGENABLED: ${NETHERMIND_PROCESSING_ENABLED:-false}
      NETHERMIND_INITCONFIG_STATEDBKEYSCHEME: HalfPath
      NETHERMIND_JSONRPCCONFIG_ENABLED: ${NETHERMIND_PROCESSING_ENABLED:-false}
      NETHERMIND_SYNCCONFIG_SYNCHRONIZATIONENABLED: ${NETHERMIND_SNAP_DOWNLOAD:-true}
      NETHERMIND_SYNCCONFIG_FASTSYNC: 'true'
      NETHERMIND_SYNCCONFIG_SNAPSYNC: 'true'
      NETHERMIND_SYNCCONFIG_STATICSNAPPIVOT: 'true'
      NETHERMIND_SYNCCONFIG_PIVOTNUMBER: ${NETHERMIND_PIVOT_NUMBER:?Set the finalized L2 pivot number in decimal}
      NETHERMIND_SYNCCONFIG_PIVOTHASH: ${NETHERMIND_PIVOT_HASH:?Set the finalized L2 pivot hash}
      NETHERMIND_SYNCCONFIG_PIVOTTOTALDIFFICULTY: '0'
      NETHERMIND_SYNCCONFIG_MAXATTEMPTSTOUPDATEPIVOT: '0'
      NETHERMIND_SYNCCONFIG_DOWNLOADHEADERSINFASTSYNC: 'true'
      NETHERMIND_SYNCCONFIG_DOWNLOADBODIESINFASTSYNC: 'true'
      NETHERMIND_SYNCCONFIG_DOWNLOADRECEIPTSINFASTSYNC: 'true'
      NETHERMIND_SYNCCONFIG_ANCIENTBODIESBARRIER: '1'
      NETHERMIND_SYNCCONFIG_ANCIENTRECEIPTSBARRIER: '1'
      NETHERMIND_SYNCCONFIG_EXITONSYNCED: 'false'
