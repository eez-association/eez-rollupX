[package]
name                   = "eez-control-rpc"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
description            = "Wire contract for the composer → prover `Prove` RPC (tonic/protobuf). Pure wire — no Prover-trait coupling."

[dependencies]
alloy-primitives = { workspace = true, features = ["rlp"] }
alloy-rlp.workspace = true
# tonic 0.14 split: "server" (the signer hosts Prove) + "channel" (the composer dials).
tonic       = { workspace = true, features = ["server", "channel"] }
tonic-prost = { workspace = true }
prost       = { workspace = true }

[build-dependencies]
# Compiles the v1 and shared v2 schemas. Needs `protoc` on PATH.
tonic-prost-build = { workspace = true }

[dev-dependencies]
alloy-primitives = { workspace = true, features = ["k256", "rlp"] }
proptest = "1"
hex.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream.workspace = true

[lints]
workspace = true
