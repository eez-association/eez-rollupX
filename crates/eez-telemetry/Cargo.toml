[package]
name = "eez-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bounded, best-effort EEZ lifecycle telemetry independent of protocol state."

[features]
default = []
native = ["dep:metrics-exporter-prometheus", "dep:tokio", "traces"]
traces = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-proto", "dep:prost", "dep:reqwest", "dep:tonic"]

[dependencies]
getrandom = "0.4.2"
hex.workspace = true
libc = "0.2"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"], optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-proto = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["blocking"], optional = true }
tonic = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile = "3"
metrics-util = { version = "0.20", default-features = false }

[lints]
workspace = true
