[package]
name                   = "eez-l1"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
description            = "L1 RPC client + Submitter task that posts L2 batches to BatchPoster.sol."

[features]
chain-spec = ["dep:reth-chainspec", "dep:reth_gnosis"]

[dependencies]
eez-blob-codec.workspace    = true
eez-protocol.workspace      = true
reth-chainspec = { workspace = true, optional = true }
reth_gnosis = { workspace = true, optional = true }

# alloy
alloy-consensus.workspace     = true
alloy-eips.workspace          = true
alloy-genesis.workspace       = true
alloy-primitives.workspace    = true
alloy-provider.workspace      = true
alloy-rlp.workspace           = true
alloy-rpc-types-eth.workspace = true
alloy-signer.workspace        = true
alloy-signer-local.workspace  = true
alloy-sol-types.workspace     = true

# bundler (eth_sendBundle) submission path
reqwest.workspace    = true
serde_json = { workspace = true, features = ["raw_value"] }
serde.workspace = true

# async + diagnostics
fail.workspace        = true
eyre.workspace        = true
thiserror.workspace   = true
tokio.workspace       = true
tracing.workspace     = true
url.workspace         = true

[dev-dependencies]
tempfile = "3"
alloy-network.workspace               = true
alloy-transport                      = { version = "2", default-features = false }
eez-payload-codec.workspace          = true
eez-primitives.workspace             = true
eez-evm.workspace                    = true
reth-chainspec.workspace             = true
reth-primitives-traits.workspace     = true
stateless-reth.workspace             = true
reth-ethereum-primitives.workspace   = true

[lints]
workspace = true
