[package]
name                   = "eez-proof-signer"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
description            = "EEZ attestation daemon: re-executes composer-streamed windows, binds supported settlement effects fail-closed, and signs the independently recomputed public-input hash."

[dependencies]
eez-l1 = { workspace = true, features = ["chain-spec"] }
# V2 streaming and common capability/witness messages.
eez-control-rpc.workspace = true
eez-blob-codec.workspace = true
eez-payload-codec.workspace = true
# Canonical `postAndVerifyBatch` ABI types and codec.
eez-protocol.workspace = true
eez-primitives.workspace = true
eez-evm.workspace = true
eez-driver = { workspace = true, features = ["observation", "derivation"] }

alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-genesis.workspace = true
alloy-primitives = { workspace = true, features = ["k256"] }
alloy-rlp.workspace = true
alloy-rpc-types-debug.workspace = true
alloy-sol-types.workspace = true

reth-chainspec.workspace = true
reth-ethereum-primitives.workspace = true
reth-evm-ethereum.workspace = true
reth-primitives-traits.workspace = true
revm.workspace = true
# The EEZ fork exposes the roots and transaction checkpoints consumed by the
# validator while sharing the workspace's Reth revision.
stateless-reth.workspace = true
stateless-tries.workspace = true

clap = { workspace = true, features = ["env"] }
eyre.workspace = true
prost.workspace = true
serde_json.workspace = true
thiserror.workspace = true
getrandom = "0.3"
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[dev-dependencies]
alloy-signer-local.workspace = true
# Independent account/storage roots for fixtures including the mandatory history predeploy.
reth-trie-common.workspace = true
# Recorded calldata fixture decoding.
hex.workspace = true
# Client-side of the in-process Prove round-trip tests.
tokio-stream = { workspace = true, features = ["net"] }
# Advance admission deadlines without imposing a short wall-clock replay budget.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
