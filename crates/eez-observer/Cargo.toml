[package]
name = "eez-observer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Read-only EEZ RPC telemetry and canonical receipt indexer."

[dependencies]
alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
eez-protocol.workspace = true
eez-blob-codec.workspace = true
eez-telemetry.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

