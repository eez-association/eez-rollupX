[package]
name                   = "eez-node-common"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
description            = "Shared reth bootstrap substrate for eez node-role binaries."

[features]
default = []
l1-startup = ["dep:eez-l1", "dep:eez-deriver", "dep:jsonrpsee", "dep:reth-rpc-eth-api", "dep:serde_json"]

[dependencies]
eez-deriver = { workspace = true, optional = true }
jsonrpsee = { workspace = true, optional = true }
reth-rpc-eth-api = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
eez-driver.workspace = true
eez-payload-codec.workspace = true
eez-l1 = { workspace = true, optional = true }

alloy-consensus.workspace                 = true
alloy-rlp.workspace                       = true
alloy-primitives.workspace                = true
alloy-eips.workspace                      = true
reth-basic-payload-builder.workspace      = true
reth-chainspec.workspace                  = true
reth-db.workspace                         = true
reth-ethereum-cli.workspace               = true
reth-ethereum-engine-primitives.workspace = true
reth-ethereum-payload-builder.workspace   = true
reth-ethereum-primitives.workspace        = true
reth-evm.workspace                        = true
reth-node-api.workspace                   = true
reth-node-builder.workspace               = true
reth-payload-primitives.workspace         = true
reth-storage-api.workspace                = true
reth-primitives-traits.workspace          = true
reth-transaction-pool.workspace           = true

clap.workspace     = true
dotenvy.workspace  = true
eyre.workspace     = true
mimalloc.workspace = true
thiserror.workspace = true
tokio.workspace    = true
tracing.workspace  = true

[lints]
workspace = true
