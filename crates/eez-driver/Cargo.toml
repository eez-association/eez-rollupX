[package]
name                   = "eez-driver"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
description            = "Engine-API consumer that drives a reth node to produce blocks on a fixed cadence."

[features]
default = []
derivation = [
    "dep:alloy-eips",
    "dep:eez-payload-codec",
    "dep:eyre",
    "dep:eez-primitives",
    "dep:eez-evm",
    "dep:reth-evm",
    "dep:reth-evm-ethereum",
    "dep:revm",
    "dep:alloy-rlp",
    "dep:reth-trie",
]
observation = [
    "dep:eyre",
    "dep:eez-primitives",
    "dep:eez-evm",
    "dep:reth-evm",
    "dep:reth-evm-ethereum",
    "dep:revm",
    "dep:alloy-sol-types",
]
witness = [
    "observation",
    "dep:eez-prover",
    "dep:eyre",
    "dep:eez-primitives",
    "dep:eez-evm",
    "dep:reth-evm",
    "dep:reth-revm",
    "dep:reth-trie",
    "dep:alloy-rlp",
    "dep:alloy-rpc-types-debug",
]

[dependencies]
# eez — enabled only for the Composer's per-block proving witness path.
eez-prover = { workspace = true, optional = true }
eez-protocol.workspace = true

eez-l1.workspace = true
eez-payload-codec = { workspace = true, optional = true }
# reth
reth-chainspec.workspace                  = true
reth-engine-primitives.workspace          = true
reth-ethereum-engine-primitives.workspace = true
eez-primitives = { workspace = true, optional = true }
eez-evm = { workspace = true, optional = true }
reth-evm = { workspace = true, optional = true }
reth-evm-ethereum = { workspace = true, optional = true }
revm = { workspace = true, optional = true }
reth-payload-builder.workspace            = true
reth-payload-primitives.workspace         = true
reth-primitives-traits.workspace          = true
reth-revm = { workspace = true, features = ["witness"], optional = true }
reth-storage-api.workspace                = true
reth-trie = { workspace = true, optional = true }

# alloy
alloy-consensus.workspace        = true
alloy-eips = { workspace = true, optional = true }
alloy-primitives.workspace       = true
alloy-rlp = { workspace = true, optional = true }
alloy-rpc-types-debug = { workspace = true, optional = true }
alloy-rpc-types-engine.workspace = true
alloy-sol-types = { workspace = true, optional = true }

# async + diagnostics
async-trait.workspace = true
eyre = { workspace = true, optional = true }
tokio.workspace       = true
tracing.workspace     = true

[dev-dependencies]
serde_json.workspace = true
reth-provider = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true
