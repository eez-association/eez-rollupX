events { worker_connections 256; }
http {
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    upstream api { server blockscout:4000; keepalive 16; }
    upstream frontend { server blockscout-web:3000; keepalive 8; }
    server {
        listen 8080;
        server_name _;
        # The host publishes this listener on another port, so an absolute
        # redirect (http://<host>:8080) would point the browser elsewhere.
        absolute_redirect off;
        # Etherscan-style clients request /api?module=... without the trailing
        # slash; serve it instead of nginx's automatic 301.
        location = /api {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
        }
        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
        }
        location /socket/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
        }
    }
}
