events { worker_connections 256; }
http {
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    upstream api { server blockscout:4000; keepalive 16; }
    upstream frontend { server blockscout-web:3000; keepalive 8; }
    server {
        listen 8080;
        server_name _;
        # Behind the TLS gateway an absolute redirect would name this
        # listener (http://<host>:8080), which HTTPS pages block as mixed
        # content and which is not published on the host.
        absolute_redirect off;
        # Etherscan-style clients request /explorer/api?module=... without the
        # trailing slash; serve it instead of nginx's automatic 301.
        location = /explorer/api {
            rewrite ^ /api break;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
        }
        location = /explorer {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
        }
        location /explorer/api/ {
            rewrite ^/explorer(/api/.*)$ $1 break;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
        }
        location /explorer/socket/ {
            rewrite ^/explorer(/socket/.*)$ $1 break;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        location /explorer/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
        }
        location / { return 404; }
    }
}
