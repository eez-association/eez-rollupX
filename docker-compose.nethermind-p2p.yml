services:
  nethermind-follower:
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${NETHERMIND_MEMORY_LIMIT:-8g}
    cpus: ${NETHERMIND_CPU_LIMIT:-2.0}
    pids_limit: 512
    tmpfs:
      - /tmp:size=268435456,mode=1777
    environment:
      NETHERMIND_INITCONFIG_DISCOVERYENABLED: 'true'
      NETHERMIND_INITCONFIG_PEERMANAGERENABLED: 'true'
      NETHERMIND_SYNCCONFIG_NETWORKINGENABLED: 'true'
      NETHERMIND_SYNCCONFIG_SNAPSERVINGENABLED: 'true'
      NETHERMIND_SYNCCONFIG_SNAPSERVINGMAXDEPTH: ${NETHERMIND_SNAP_SERVING_DEPTH:-16384}
      NETHERMIND_NETWORKCONFIG_LOCALIP: 0.0.0.0
      NETHERMIND_NETWORKCONFIG_EXTERNALIP: ${NETHERMIND_P2P_IP:?Set the advertised P2P IPv4 address}
      NETHERMIND_NETWORKCONFIG_ENABLEEXTERNALIPRESOLUTION: 'false'
      NETHERMIND_NETWORKCONFIG_P2PPORT: ${NETHERMIND_P2P_PORT:-30303}
      NETHERMIND_NETWORKCONFIG_DISCOVERYPORT: ${NETHERMIND_P2P_PORT:-30303}
      NETHERMIND_NETWORKCONFIG_MAXACTIVEPEERS: '20'
      NETHERMIND_NETWORKCONFIG_ONLYSTATICPEERS: 'false'
      NETHERMIND_NETWORKCONFIG_BOOTNODES: ${NETHERMIND_BOOTNODES:-}
      NETHERMIND_NETWORKCONFIG_DISABLEDISCV4DNSFEEDER: 'true'
      NETHERMIND_DISCOVERYCONFIG_DISCOVERYVERSION: V4
      NETHERMIND_DISCOVERYCONFIG_USEDEFAULTDISCV5BOOTNODES: 'false'
      NETHERMIND_JSONRPCCONFIG_ENABLEDMODULES: Eth,Net,Web3,Admin
    ports:
      - ${NETHERMIND_P2P_PORT:-30303}:${NETHERMIND_P2P_PORT:-30303}/tcp
      - ${NETHERMIND_P2P_PORT:-30303}:${NETHERMIND_P2P_PORT:-30303}/udp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
