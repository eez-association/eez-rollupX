# Default local devnet profile.
ethereum_package:
  participants:
    - el_type: reth
      el_image: ghcr.io/paradigmxyz/reth:latest
      cl_type: lighthouse
      cl_image: sigp/lighthouse:v8.1.2
      # Native blob DA needs the complete post-Fulu blob reconstruction API.
      supernode: true
      count: 1

  network_params:
    network_id: "7331"
    seconds_per_slot: 12
    slot_duration_ms: 12000
    genesis_gaslimit: 60000000
    min_validator_withdrawability_delay: 1
    shard_committee_period: 1
    deneb_fork_epoch: 0
    electra_fork_epoch: 0
    fulu_fork_epoch: 0
    bpo_1_epoch: 0
    bpo_1_max_blobs: 15
    bpo_1_target_blobs: 10
    bpo_1_base_fee_update_fraction: 8346193
    prefunded_accounts: '{"0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266": {"balance": "1000000ETH"}, "0x70997970C51812dc3A010C7d01b50e0d17dc79C8": {"balance": "1000000ETH"}, "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC": {"balance": "1000000ETH"}, "0xb9e79D19f651a941757b35830232E7EFC77E1c79": {"balance": "1000000ETH"}}'

  mev_type: flashbots
  mev_params:
    mev_builder_image: ethpandaops/reth-rbuilder:develop
    # Includes the devnet cold-start fix; keep this immutable so a stale local
    # `main` image cannot silently leave the builder without proposer duties.
    mev_relay_image: ethpandaops/mev-boost-relay@sha256:3600f04fcaf0bbb231f4737470f094fdf2314db54b4853197fa369aea90f8b19
    mev_boost_image: ethpandaops/mev-boost:develop
    mev_builder_cl_image: sigp/lighthouse:v8.1.2
    mev_builder_subsidy: 1

eez:
  # The pinned Ethereum package reserves 500m and caps 3000m for each of
  # Redis, relay API, housekeeper and website. Fit the same topology on a
  # 2-CPU hosted runner without disabling Kurtosis resource validation.
  mev_relay_cpu:
    min: 100
    max: 2000

  # Blockscout adds eight services (frontend, backend, verifier, and database
  # for each chain). Disable it for a lighter network.
  enable_explorers: true
  enable_ui: true
  enable_demo_apps: true

  eez_node_image: eez-node:ci
  proof_signer_image: eez-proof-signer:ci
  deploy_image: eez-deploy:ci
  ui_image: eez-rollup-ui:ci
  follower_image: sigp/lighthouse:v8.1.2
  blockscout_postgres_image: postgres:alpine
  blockscout_image: ghcr.io/blockscout/blockscout:latest
  blockscout_verifier_image: ghcr.io/blockscout/smart-contract-verifier:latest
  blockscout_frontend_image: ghcr.io/blockscout/frontend:latest

  # Deterministic private-network keys only; never use these on a public chain.
  poster_key: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
  proof_signer_key: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
  l1_block_time_ms: 12000
  l2_block_time_ms: 2000
  # P=3 opens at T-6000. Plan 4s for proving, 1350ms for preparation and
  # 150ms for post-proof work; all share the actual T-500 submission deadline.
  proof_time_ms: 4000
  submission_slack_ms: 500
  bundle_submission_lead_ms: 7500
  max_speculative_depth: 0
  # Fulu is active at genesis, so pooled blob transactions use EIP-7594.
  blob_sidecar_encoding: eip7594

  fee_recipient: "0x4444444444444444444444444444444444444444"

  # Keep the mandatory new-network policy explicit in the CI deployment. The
  # interval is short enough to establish canonical readiness even before a
  # workload, while accepted cross-chain work remains immediately eligible.
  settlement_env:
    # Private-network economics: parity conversion, 20% quote margin, no
    # off-chain service allowance. The expiry is 2100-01-01, not a live price feed.
    EEZ_FEES_L1_TO_L2_ENABLED: "true"
    EEZ_FEES_L2_TO_L1_ENABLED: "true"
    EEZ_L2_FEE_RECIPIENT: "0x4444444444444444444444444444444444444444"
    EEZ_FEES_VALID_UNTIL_L1_TIMESTAMP: "4102444800"
    EEZ_FEES_L1_PER_L2_NUMERATOR: "1"
    EEZ_FEES_L1_PER_L2_DENOMINATOR: "1"
    EEZ_FEES_PROVING_COST_L1: "0"
    EEZ_FEES_OPERATIONS_COST_L1: "0"
    EEZ_FEES_TREASURY_COST_L1: "0"
    EEZ_FEES_RISK_BPS: "0"
    EEZ_FEES_PROFIT_BPS: "2000"
    EEZ_FEES_EXCLUDED_SENDERS: ""
    EEZ_FEES_L1_REFUND_RECIPIENT: "0x5555555555555555555555555555555555555555"
    EEZ_FEES_L1_REFUND_PERCENT: "90"
    # K=6: P=3 leaves 6s for preparation, proof, slack and the 150ms reserve.
    EEZ_SETTLEMENT_START_AFTER_BLOCK: "3"
    EEZ_SETTLEMENT_PURE_L2_MODE: "interval"
    EEZ_SETTLEMENT_PURE_L2_INTERVAL_MS: "60000"
    EEZ_SETTLEMENT_MAX_UNSETTLED_L2_BLOCKS: "150"
    EEZ_SETTLEMENT_BLOB_FULLNESS_BPS: "off"
    EEZ_L1_POSTBATCH_MAX_FEE_PER_GAS: "100000000000"
    EEZ_L1_POSTBATCH_MAX_FEE_PER_BLOB_GAS: "100000000000"
    EEZ_L1_POSTBATCH_MAX_PRIORITY_FEE: "2000000000"
    EEZ_L1_POSTBATCH_EXECUTION_HEADROOM_BPS: "10000"
    EEZ_L1_POSTBATCH_BLOB_HEADROOM_BPS: "10000"
    EEZ_L1_POSTBATCH_GAS_MARGIN_BPS: "500"
    # Fund the local PBS payout even when the otherwise idle chain estimates
    # a zero tip. This is a deterministic test floor, not a production value.
    EEZ_L1_POSTBATCH_MIN_PRIORITY_FEE: "1000000000"
