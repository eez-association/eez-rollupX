# Public disposable developer network for the current blob-DA implementation.
# The deterministic keys below are intentionally public and must never hold
# real value or be reused outside this private Kurtosis network.
ethereum_package:
  participants:
    - el_type: reth
      el_image: ghcr.io/paradigmxyz/reth@sha256:0d16db7cfaa9e2aa8dc87664f94fd87d9a34f1a79d7eeded1c4867f91f9c13d4
      cl_type: lighthouse
      cl_image: sigp/lighthouse@sha256:9e71f6db59d358acb43719fcc5240952811821cc2fc4c3cfa90e57f2e4b38288
      # Required by the post-Fulu full-blob Beacon API. Remove only after the
      # retrieval layer can reconstruct blobs from partial custody columns.
      supernode: true
      count: 1

  network_params:
    network_id: "7331"
    seconds_per_slot: 12
    slot_duration_ms: 12000
    genesis_gaslimit: 60000000
    min_validator_withdrawability_delay: 1
    shard_committee_period: 1
    deneb_fork_epoch: 0
    electra_fork_epoch: 0
    fulu_fork_epoch: 0
    bpo_1_epoch: 0
    bpo_1_max_blobs: 15
    bpo_1_target_blobs: 10
    bpo_1_base_fee_update_fraction: 8346193
    prefunded_accounts: '{"0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266": {"balance": "1000000ETH"}, "0x70997970C51812dc3A010C7d01b50e0d17dc79C8": {"balance": "1000000ETH"}, "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC": {"balance": "1000000ETH"}, "0xb9e79D19f651a941757b35830232E7EFC77E1c79": {"balance": "1000000ETH"}}'

  mev_type: flashbots
  mev_params:
    mev_builder_image: ethpandaops/reth-rbuilder@sha256:916ba84da2690e3e368f57da5b0c73bfd919b452de8b95f64895846e0f3a8308
    mev_relay_image: ethpandaops/mev-boost-relay@sha256:3600f04fcaf0bbb231f4737470f094fdf2314db54b4853197fa369aea90f8b19
    mev_boost_image: ethpandaops/mev-boost@sha256:47ef3f0c7166cbfc5e925921b6448be7e67b6d47615e9f1f36b098b3905fb223
    mev_builder_cl_image: sigp/lighthouse@sha256:9e71f6db59d358acb43719fcc5240952811821cc2fc4c3cfa90e57f2e4b38288
    mev_builder_subsidy: 1

eez:
  mev_relay_cpu:
    min: 100
    max: 2000
  enable_explorers: true
  enable_blobscan: true
  enable_ui: true
  enable_demo_apps: true

  eez_node_image: eez-node:settlement-policy
  proof_signer_image: eez-proof-signer:settlement-policy
  deploy_image: eez-deploy:settlement-policy-devnet
  ui_image: eez-rollup-ui:devnet
  follower_image: sigp/lighthouse:v8.1.2
  blockscout_postgres_image: postgres:alpine
  blockscout_image: ghcr.io/blockscout/blockscout:latest
  blockscout_verifier_image: ghcr.io/blockscout/smart-contract-verifier:latest
  blockscout_frontend_image: ghcr.io/blockscout/frontend:latest
  blobscan_api_image: eez-blobscan-api:1.40.3-chain7331
  blobscan_web_image: eez-blobscan-web:1.40.3-chain7331
  blobscan_indexer_image: blossomlabs/blobscan-indexer@sha256:5dd9d1de60d2d6875fa2655097b4388cb058566f2ab5b63623c6c728bbe281dc
  blobscan_postgres_image: postgres:alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
  blobscan_redis_image: redis:alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576

  poster_key: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
  proof_signer_key: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
  l1_block_time_ms: 12000
  l2_block_time_ms: 2000
  proof_time_ms: 4000
  # Covers a full six-blob empty-history batch, including timing-grid slack.
  proof_signer_max_request_blocks: 1024
  submission_slack_ms: 500
  bundle_submission_lead_ms: 7500
  max_speculative_depth: 0
  # The pinned ethereum-package activates Fulu at genesis.
  blob_sidecar_encoding: eip7594

  fee_recipient: "0x0000000000000000000000000000000000000000"
  l2_system_key: "0x6f7d72ecb79c8bf1bd8e7c49a1c4a22741ab708f06bb19e5b5d44a6f0934a7c1"

  # Empty history consolidates every 900 L2 blocks (nominally 30 minutes).
  # Included pure-L2 transactions and validated cross-chain work post earlier
  # at the next eligible L1 opportunity. Fullness is disabled for this profile.
  settlement_env:
    EEZ_SETTLEMENT_PURE_L2_MODE: "always"
    EEZ_SETTLEMENT_MAX_UNSETTLED_L2_BLOCKS: "900"
    EEZ_SETTLEMENT_BLOB_FULLNESS_BPS: "off"
    EEZ_L1_POSTBATCH_MAX_FEE_PER_GAS: "100000000000"
    EEZ_L1_POSTBATCH_MAX_FEE_PER_BLOB_GAS: "100000000000"
    EEZ_L1_POSTBATCH_MAX_PRIORITY_FEE: "2000000000"
    EEZ_L1_POSTBATCH_EXECUTION_HEADROOM_BPS: "10000"
    EEZ_L1_POSTBATCH_BLOB_HEADROOM_BPS: "10000"
    EEZ_L1_POSTBATCH_GAS_MARGIN_BPS: "500"
    # Local PBS fixture: fund the builder payout on this otherwise idle chain.
    EEZ_L1_POSTBATCH_MIN_PRIORITY_FEE: "1000000000"
