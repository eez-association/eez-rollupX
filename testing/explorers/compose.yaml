name: eez-chiado-explorers

x-common: &common
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "3"

services:
  blockscout-db:
    <<: *common
    image: postgres@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: ${BLOCKSCOUT_DB_PASSWORD:?run prepare.py first}
    volumes: [blockscout-db:/var/lib/postgresql/data]
    shm_size: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U blockscout -d blockscout"]
      interval: 5s
      timeout: 3s
      retries: 20

  verifier:
    <<: *common
    image: ghcr.io/blockscout/smart-contract-verifier@sha256:c9e4e022ba2b1cc24fe70e581d835e873c6c374545b3a0fd209e16ff03f93d78
    environment:
      SMART_CONTRACT_VERIFIER__SERVER__HTTP__ADDR: 0.0.0.0:8050

  blockscout:
    <<: *common
    image: eez-blockscout:9.0.2-pooled
    depends_on:
      blockscout-db: {condition: service_healthy}
    extra_hosts: [host.docker.internal:host-gateway]
    ports: ["127.0.0.1:18111:4000"]
    volumes:
      - ${L2_GENESIS:?run prepare.py first}:/chain-spec/genesis.json:ro
    environment:
      DATABASE_URL: postgresql://blockscout:${BLOCKSCOUT_DB_PASSWORD}@blockscout-db:5432/blockscout
      SECRET_KEY_BASE: ${BLOCKSCOUT_SECRET_KEY_BASE:?run prepare.py first}
      ETHEREUM_JSONRPC_VARIANT: erigon
      ETHEREUM_JSONRPC_HTTP_URL: ${L2_RPC_FROM_DOCKER:-http://host.docker.internal:18081/rpc/l2}
      ETHEREUM_JSONRPC_TRACE_URL: ${L2_RPC_FROM_DOCKER:-http://host.docker.internal:18081/rpc/l2}
      CHAIN_ID: "6290"
      CHAIN_SPEC_PATH: /chain-spec/genesis.json
      CHAIN_SPEC_PROCESSING_DELAY: 1s
      NETWORK: EEZ L2 on Chiado
      SUBNETWORK: EEZ L2 on Chiado
      COIN: ETH
      COIN_NAME: Test Ether
      PORT: "4000"
      API_V2_ENABLED: "true"
      ECTO_USE_SSL: "false"
      DISABLE_MARKET: "true"
      INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"
      INDEXER_CATCHUP_BLOCKS_BATCH_SIZE: "50"
      INDEXER_CATCHUP_BLOCKS_CONCURRENCY: "2"
      INDEXER_INTERNAL_TRANSACTIONS_CONCURRENCY: "2"
      INDEXER_RECEIPTS_CONCURRENCY: "2"
      INDEXER_COIN_BALANCES_CONCURRENCY: "2"
      INDEXER_BLOCK_REWARD_CONCURRENCY: "2"
      POOL_SIZE: "20"
      POOL_SIZE_API: "10"
      ERL_FLAGS: +S 4:4
      MICROSERVICE_SC_VERIFIER_ENABLED: "true"
      MICROSERVICE_SC_VERIFIER_URL: http://verifier:8050/
      MICROSERVICE_SC_VERIFIER_TYPE: sc_verifier
    command:
      - /bin/sh
      - -ec
      - 'bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()"; exec bin/blockscout start'

  blockscout-web:
    <<: *common
    image: ghcr.io/blockscout/frontend@sha256:4b69f44148414b55c6b8550bc3270c63c9f99e923d54ef0b307e762af6bac90a
    depends_on: [blockscout]
    volumes: ["./blockscout-browser.sh:/app/eez-browser.sh:ro"]
    command: [/bin/bash, /app/eez-browser.sh]
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_API_HOST: blockscout:4000
      NEXT_PUBLIC_API_PROTOCOL: http
      NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: ws
      NEXT_PUBLIC_USE_NEXT_JS_PROXY: "true"
      NEXT_PUBLIC_APP_HOST: 127.0.0.1
      NEXT_PUBLIC_APP_PROTOCOL: http
      NEXT_PUBLIC_APP_PORT: "18110"
      NEXT_PUBLIC_NETWORK_ID: "6290"
      NEXT_PUBLIC_NETWORK_NAME: EEZ L2 on Chiado
      NEXT_PUBLIC_NETWORK_SHORT_NAME: EEZ L2
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: Test Ether
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: ETH
      NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: "18"
      NEXT_PUBLIC_NETWORK_VERIFICATION_TYPE: validation
      NEXT_PUBLIC_IS_TESTNET: "true"
      NEXT_PUBLIC_HAS_BEACON_CHAIN: "false"
      NEXT_PUBLIC_WEB3_WALLETS: none
      NEXT_PUBLIC_AD_BANNER_PROVIDER: none
      NEXT_PUBLIC_AD_TEXT_PROVIDER: none
      NEXT_PUBLIC_HOMEPAGE_CHARTS: "[]"
      NEXT_PUBLIC_GAS_TRACKER_ENABLED: "true"
      FAVICON_MASTER_URL: data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxODAiIGhlaWdodD0iMTgwIiB2aWV3Qm94PSIwIDAgMTgwIDE4MCI+PHJlY3Qgd2lkdGg9IjE4MCIgaGVpZ2h0PSIxODAiIHJ4PSIzMiIgZmlsbD0iIzFhMjAyYyIvPjxwYXRoIGZpbGw9IiNmZmZmZmYiIGQ9Ik00MiA0Mmg5NnYyMkg2NnYxNmg2MHYyMkg2NnYxNmg3MnYyMkg0MnoiLz48L3N2Zz4=

  blockscout-gateway:
    <<: *common
    image: nginx@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    depends_on: [blockscout, blockscout-web]
    ports: ["127.0.0.1:18110:8080"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]

  blobscan-db:
    <<: *common
    image: postgres@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    environment:
      POSTGRES_DB: blobscan
      POSTGRES_USER: blobscan
      POSTGRES_PASSWORD: ${BLOBSCAN_DB_PASSWORD:?run prepare.py first}
    volumes: [blobscan-db:/var/lib/postgresql/data]
    shm_size: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U blobscan -d blobscan"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *common
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  blobscan-api:
    <<: *common
    image: eez-blobscan-api:1.40.3-chiado
    entrypoint: [/bin/bash, /docker-entrypoint.sh]
    command: [api]
    depends_on:
      blobscan-db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:18101:3001"]
    environment: &blobscan-env
      DATABASE_URL: postgresql://blobscan:${BLOBSCAN_DB_PASSWORD}@blobscan-db:5432/blobscan
      DIRECT_URL: postgresql://blobscan:${BLOBSCAN_DB_PASSWORD}@blobscan-db:5432/blobscan
      REDIS_URI: redis://redis:6379
      SECRET_KEY: ${BLOBSCAN_SECRET_KEY:?run prepare.py first}
      CHAIN_ID: "10200"
      NETWORK_NAME: chiado
      POSTGRES_STORAGE_ENABLED: "true"
      PRIMARY_BLOB_STORAGE: postgres
      ETH_PRICE_SYNCER_ENABLED: "false"
      BLOBSCAN_API_BASE_URL: http://127.0.0.1:18101
      STATS_SYNCER_OVERALL_CRON_PATTERN: "*/1 * * * *"
      STATS_SYNCER_DAILY_CRON_PATTERN: "*/1 * * * *"
      # Aggregate only the explicitly verified retained history, without
      # changing Chiado's real Deneb fork slot or any chain parameters.
      STATS_SYNCER_LOWEST_SLOT: "24788218"
      BLOBSCAN_API_PORT: "3001"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/healthcheck').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30

  blobscan-web:
    <<: *common
    image: eez-blobscan-web:1.40.3-chiado
    entrypoint: [/bin/bash, /docker-entrypoint.sh]
    command: [web]
    depends_on:
      blobscan-api: {condition: service_healthy}
    ports: ["127.0.0.1:18100:3000"]
    environment:
      <<: *blobscan-env
      BLOBSCAN_API_BASE_URL: http://blobscan-api:3001
      PUBLIC_NETWORK_NAME: chiado
      PUBLIC_EXPLORER_BASE_URL: https://gnosis-chiado.blockscout.com
      PUBLIC_BEACON_BASE_URL: https://chiado.beaconcha.in
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"

  blobscan-indexer:
    <<: *common
    image: blossomlabs/blobscan-indexer@sha256:5dd9d1de60d2d6875fa2655097b4388cb058566f2ab5b63623c6c728bbe281dc
    # Only this outbound-only service needs direct access to loopback Lighthouse.
    network_mode: host
    depends_on:
      blobscan-api: {condition: service_healthy}
    environment:
      BEACON_NODE_ENDPOINT: http://127.0.0.1:6152
      EXECUTION_NODE_ENDPOINT: http://127.0.0.1:18645
      BLOBSCAN_API_ENDPOINT: http://127.0.0.1:18101
      NETWORK_NAME: chiado
      SECRET_KEY: ${BLOBSCAN_SECRET_KEY}
      RUST_LOG: info
    command: [--num-threads, "2", --slots-per-save, "16", --disable-sync-historical]

volumes:
  blockscout-db:
  blobscan-db:
  redis:
