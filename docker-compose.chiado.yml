# Lighthouse beacon node (chiado) for the embedded reth_gnosis L1 running
# inside `eez-node` (composer mode, EEZ_L1_CHAIN=chiado).
#
# Lighthouse runs as a separate container with `network_mode: host` so it
# can dial the eez-node's L1 authrpc on the host (default 127.0.0.1:18551).
# Adapted from `/root/docker-compose-reth-chiado.yaml` — the standalone
# reth_gnosis service is dropped here because that role is filled by
# eez-node's embedded GnosisNode.
#
# Required env (export before `docker compose up`):
#   - EEZ_L1_JWT_SECRET           — absolute host path to the shared
#                                    jwt.hex (the same path passed to
#                                    eez-node via `EEZ_L1_JWT_SECRET`).
#   - EEZ_CHIADO_LIGHTHOUSE_DATA  — host path for lighthouse state (will
#                                    be created if absent).
#   - EEZ_CHIADO_CONFIG_DIR       — host path containing the chiado
#                                    `config.yaml` etc (e.g.
#                                    `/root/configs/chiado`).
#   - EEZ_L1_AUTH_PORT            — eez-node's authrpc port; default 18551.

version: "3"
services:
  lighthouse:
    image: sigp/lighthouse:v8.1.3
    container_name: chiado-lighthouse-eezrollup
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${EEZ_CHIADO_LIGHTHOUSE_DATA:?set EEZ_CHIADO_LIGHTHOUSE_DATA}:/data
      - ${EEZ_L1_JWT_SECRET:?set EEZ_L1_JWT_SECRET}:/jwt/jwt.hex:ro
      - ${EEZ_CHIADO_CONFIG_DIR:?set EEZ_CHIADO_CONFIG_DIR}:/config-dir:ro
    command:
      - lighthouse
      - beacon_node
      - --testnet-dir=/config-dir
      - --listen-address=0.0.0.0
      # Ports moved off both the host chiado-lighthouse (9105/6052) and the
      # dockerized eez-node lighthouse (9205/9206/6152) to avoid AddrInUse.
      - --port=9405
      - --quic-port=9406
      - --http
      - --http-address=127.0.0.1
      - --http-port=6352
      - --execution-endpoints=http://127.0.0.1:${EEZ_L1_AUTH_PORT:-18551}
      - --jwt-secrets=/jwt/jwt.hex
      - --datadir=/data
      - --checkpoint-sync-url=https://checkpoint.chiadochain.net/
      # Chiado is post-Fulu. A semi-supernode custodies half the PeerDAS data
      # columns and reconstructs the full blobs required by the L2 deriver.
      - --semi-supernode
      # Direct endpoints supplement sparse discovery. Peer IDs may rotate;
      # Lighthouse validates the configured network after dialing the endpoint.
      - --libp2p-addresses=/ip4/57.131.40.177/tcp/9000,/ip4/45.79.214.176/tcp/9000,/ip4/51.210.221.124/tcp/9500,/ip4/57.129.122.18/tcp/9000,/ip4/51.210.221.124/tcp/9100,/ip4/137.74.112.3/tcp/9000,/ip4/65.109.101.48/tcp/9000
    logging:
      driver: "local"
