global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: eez-composer-reth
    scrape_interval: 1s
    scrape_timeout: 1s
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:19091
    # Native Reth chain metrics mix embedded L1 and L2. Keep only the
    # explicitly Composer-owned queue families for this first dashboard.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: reth_eez_composer_queue_(requests|readiness_requests|blocked_requests|sample_timestamp_seconds|oldest_pending_timestamp_seconds|evaluation_timestamp_seconds)
        action: keep
