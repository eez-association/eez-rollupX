# The eez-node integration tests spawn Anvil, a builder stub, and multiple
# reth processes. Keep those tests serial without constraining other packages.
[[profile.default.overrides]]
filter = "package(eez-node-e2e) & kind(test)"
threads-required = "num-cpus"
test-group = "integration"

[test-groups]
integration = { max-threads = 1 }

# Include the exact shipping binaries required by CI E2E tests.
[profile.ci-archive]
archive.include = [
    { path = "release/eez-runtime", relative-to = "target", on-missing = "error" },
]

# CI retries for diagnostics, but a pass on retry is still a failure: a flaky
# integration test must not make the branch green.
[profile.ci]
inherits = "default"
retries = 2
flaky-result = "fail"
